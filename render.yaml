###############################################################################
# Render Blueprint — Counselor Student Action Center
#
# Two services from this monorepo:
#   1. counselor-action-center-api  → Node.js web service  (env: node)
#   2. counselor-action-center-web  → React static site    (env: static)
#
# fromService.property uses "host" (bare hostname, no protocol).
# Both services prepend "https://" in code when the value has no scheme.
###############################################################################

services:

  # ── Backend API (Node.js) ──────────────────────────────────────────────────
  - type: web
    name: counselor-action-center-api
    env: node
    plan: free
    region: oregon
    rootDir: counselor-action-center/backend

    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # Render provides the bare hostname; app.ts prepends https:// if absent
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: counselor-action-center-web
          property: host


  # ── Frontend Static Site (React / Vite) ────────────────────────────────────
  - type: web
    name: counselor-action-center-web
    env: static
    rootDir: counselor-action-center/frontend

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      # Render provides the bare hostname; api/client.ts prepends https:// if absent
      - key: VITE_API_URL
        fromService:
          type: web
          name: counselor-action-center-api
          property: host

    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
