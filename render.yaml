###############################################################################
# Render Blueprint — Counselor Student Action Center
#
# Two services from this monorepo:
#   1. counselor-action-center-api  → Node.js web service  (env: node)
#   2. counselor-action-center-web  → React static site    (env: static)
#
# fromService wires CORS origin and the frontend API base URL automatically.
###############################################################################

services:

  # ── Backend API (Node.js) ──────────────────────────────────────────────────
  - type: web
    name: counselor-action-center-api
    env: node
    plan: free
    region: oregon
    rootDir: counselor-action-center/backend

    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # Auto-filled with the static site's https:// URL for CORS
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: counselor-action-center-web
          property: hostWithProtocol


  # ── Frontend Static Site (React / Vite) ────────────────────────────────────
  - type: web
    name: counselor-action-center-web
    env: static
    plan: free
    rootDir: counselor-action-center/frontend

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      # Baked into the JS bundle at build time by Vite.
      # Auto-filled with the backend's https:// URL.
      - key: VITE_API_URL
        fromService:
          type: web
          name: counselor-action-center-api
          property: hostWithProtocol

    headers:
      # HTML shell must revalidate — JS/CSS assets are content-hashed by Vite
      # so they can be cached indefinitely
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      # SPA fallback: all non-asset paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
